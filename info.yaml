
# Tiny Tapeout project information
project:
  title:        "AES implementation"      # Project title
  author:       "Sahana Srinivasan"      # Your name
  discord:      "ssri365"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "This project is an AES encryption implementation inspired by the Tiny Tapeout Workshop hosted by Anton Maurovic in the Down Underflow 2026 Conference."     # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25175000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_xxsahanaxx_aes"
  
  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "aes/aes_ks_static_128.v"
    - "aes/aes_mixcolumns_inv.v"
    - "aes/aes_mixcolumns.v"
    - "aes/aes_sbox_lut.v"
    - "aes/aes_sbox.v"
    - "aes/aes_sboxes.v"
    - "aes/aes_shiftrows_inv.v"
    - "aes/aes_shiftrows.v"
    - "aes_core_static_128.v"
    - "shift_register.v"
    - "spi_aes_top.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "RST_N"
  ui[1]: "SCK"
  ui[2]: "MOSI"
  ui[3]: "NORM_CS_N"
  ui[4]: "START"
  ui[5]: "ENCRYPT_NDECRYPT"
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "MISO"
  uo[1]: "ICE_LED"
  uo[2]: "BUSY"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
